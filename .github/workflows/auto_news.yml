name: Auto Generate Sports News

on:
  workflow_dispatch: # كيمكنك تشغل السكريبت يدوياً من GitHub Actions
  schedule:
    - cron: '0 0 * * *' # كتخدم أوتوماتيكياً مرة كل نهار

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade google-generativeai

    - name: Run News Generator
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python update_news.py

    - name: Commit and Push Changes
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: "Auto-update sports news via Gemini API"
        branch: main
