name: Auto Generate News

on:
  schedule:
    - cron: '0 */6 * * *' # كيتخدم كل 6 سوايع
  workflow_dispatch:      # باش تقدر تخدمو بيدك ديريكت

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run News Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_news.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update sports news via Gemini API"
          file_pattern: index.html
