name: Auto Update RSS News

on:
  schedule:
    - cron: '*/15 * * * *' # Refresh news and live scoreboards every 15 minutes.
  workflow_dispatch:      # Bach t9ad tkhddmo b yddk wqtma bghiti

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run News Script
        run: python update_news.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update live sports news from RSS"
          file_pattern: "*.html sitemap.xml feed.xml"
